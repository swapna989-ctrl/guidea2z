<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Saved Guides - guidea2z</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/theme.css">
  <script src="../js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabaseClient.js"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#994530",
            "primary-container": "#f28b71",
            "on-primary": "#ffffff",
            "on-primary-container": "#6c2412",
            "secondary": "#446555",
            "secondary-container": "#c3e8d4",
            "surface": "#fff8f6",
            "surface-container": "#fceae6",
            "surface-container-low": "#fff1ed",
            "surface-container-high": "#f6e4e0",
            "surface-container-lowest": "#ffffff",
            "on-surface": "#221a17",
            "on-surface-variant": "#55433e",
            "outline": "#88726d",
            "outline-variant": "#dbc1bb",
            "background": "#fff8f6"
          },
          fontFamily: {
            sans: ["Hanken Grotesk", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"]
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1;
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-sans antialiased selection:bg-primary-container selection:text-on-primary-container pb-24 md:pb-12">

  <!-- Top Header -->
  <header class="sticky top-0 z-40 bg-surface/90 backdrop-blur-md border-b border-outline-variant/30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      
      <a href="../index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-primary text-white flex items-center justify-center font-extrabold text-xl shadow-md">
          g
        </div>
        <span class="font-extrabold text-xl text-primary tracking-tight">guidea2z</span>
      </a>

      <!-- Search Bar -->
      <div class="flex-1 max-w-md mx-4">
        <div class="relative w-full">
          <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-outline text-lg pointer-events-none">search</span>
          <input 
            type="text" 
            id="saved-search" 
            placeholder="Search your saved guides..." 
            class="w-full pl-10 pr-4 py-2 bg-surface-container-lowest border border-outline-variant/60 rounded-full text-xs text-on-surface placeholder:text-outline/70 focus:outline-none focus:ring-2 focus:ring-primary/30"
          />
        </div>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-2">
        <button type="button" class="theme-toggle-btn w-9 h-9 flex items-center justify-center rounded-full bg-surface-container hover:bg-surface-container-high text-on-surface-variant hover:text-primary transition-colors active:scale-95 duration-200" title="Toggle Dark/Light Mode">
          <span class="material-symbols-outlined text-lg theme-toggle-icon">dark_mode</span>
        </button>
        <a href="../account_settings/code.html" class="w-9 h-9 rounded-full bg-primary text-white flex items-center justify-center font-bold text-xs shadow-xs">
          <span class="material-symbols-outlined text-base">person</span>
        </a>
      </div>

    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 space-y-6 flex-1">
    
    <!-- Title & Stats -->
    <div class="flex items-center justify-between flex-wrap gap-2">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-on-surface tracking-tight flex items-center gap-2">
          <span class="material-symbols-outlined text-primary text-2xl fill">bookmark</span>
          Your Saved Library
        </h1>
        <p class="text-xs sm:text-sm text-on-surface-variant mt-1">
          Access your bookmarked study roadmaps, exam checklists, and placement resources anytime.
        </p>
      </div>
      <span id="saved-count-badge" class="px-3 py-1.5 bg-primary/10 text-primary text-xs font-bold rounded-full">
        0 Guides Saved
      </span>
    </div>

    <!-- Department Quick Filter Tabs -->
    <div class="flex gap-2 overflow-x-auto pb-1" id="saved-dept-tabs">
      <button onclick="filterSavedByDept('All', this)" class="saved-dept-btn px-4 py-1.5 rounded-full text-xs font-bold bg-primary text-on-primary shadow-2xs transition-all whitespace-nowrap">
        All
      </button>
      <button onclick="filterSavedByDept('CSE', this)" class="saved-dept-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-surface-container-lowest hover:bg-surface-container border border-outline-variant/40 text-on-surface transition-all whitespace-nowrap">
        CSE
      </button>
      <button onclick="filterSavedByDept('CSM', this)" class="saved-dept-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-surface-container-lowest hover:bg-surface-container border border-outline-variant/40 text-on-surface transition-all whitespace-nowrap">
        CSM
      </button>
      <button onclick="filterSavedByDept('ECE', this)" class="saved-dept-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-surface-container-lowest hover:bg-surface-container border border-outline-variant/40 text-on-surface transition-all whitespace-nowrap">
        ECE
      </button>
      <button onclick="filterSavedByDept('MECH', this)" class="saved-dept-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-surface-container-lowest hover:bg-surface-container border border-outline-variant/40 text-on-surface transition-all whitespace-nowrap">
        MECH
      </button>
    </div>

    <!-- Saved Guides Grid -->
    <div id="saved-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
      <!-- Rendered via JS -->
    </div>

  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-surface/95 backdrop-blur-lg border-t border-outline-variant/30 shadow-lg pb-safe">
    <div class="flex justify-around items-center h-16 px-2">
      <a href="../index.html" class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary active:scale-95 transition-all w-16">
        <span class="material-symbols-outlined text-2xl">home</span>
        <span class="text-[10px] mt-0.5">Home</span>
      </a>
      <a href="../browse_new_theme/code.html" class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary active:scale-95 transition-all w-16">
        <span class="material-symbols-outlined text-2xl">explore</span>
        <span class="text-[10px] mt-0.5">Browse</span>
      </a>
      <a href="../post_guide_new_theme/code.html" class="flex flex-col items-center justify-center -translate-y-2 group">
        <div class="w-12 h-12 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-lg group-active:scale-90 transition-transform">
          <span class="material-symbols-outlined text-2xl font-bold">add</span>
        </div>
        <span class="text-[10px] font-bold text-primary mt-1">Post</span>
      </a>
      <a href="../saved_guides/code.html" class="flex flex-col items-center justify-center text-primary font-bold active:scale-95 transition-all w-16">
        <span class="material-symbols-outlined text-2xl fill">bookmark</span>
        <span class="text-[10px] mt-0.5 font-bold">Saved</span>
      </a>
      <a href="../account_settings/code.html" class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary active:scale-95 transition-all w-16">
        <span class="material-symbols-outlined text-2xl">person</span>
        <span class="text-[10px] mt-0.5">Profile</span>
      </a>
    </div>
  </nav>

  <script>
    let savedGuidesList = [];
    let currentSavedDept = 'All';
    let currentSavedQuery = '';

    document.addEventListener('DOMContentLoaded', async () => {
      await loadSavedData();

      document.getElementById('saved-search').addEventListener('input', (e) => {
        currentSavedQuery = e.target.value.trim().toLowerCase();
        renderSavedGrid();
      });
    });

    async function loadSavedData() {
      try {
        if (window.Guidea2zSupabase) {
          savedGuidesList = await window.Guidea2zSupabase.db.fetchSavedGuides();
        }
      } catch (e) {
        console.warn('Error fetching saved guides:', e);
      }
      renderSavedGrid();
    }

    function filterSavedByDept(dept, btn) {
      currentSavedDept = dept;
      document.querySelectorAll('.saved-dept-btn').forEach(b => {
        b.className = "saved-dept-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-surface-container-lowest hover:bg-surface-container border border-outline-variant/40 text-on-surface transition-all whitespace-nowrap";
      });
      if (btn) {
        btn.className = "saved-dept-btn px-4 py-1.5 rounded-full text-xs font-bold bg-primary text-on-primary shadow-2xs transition-all whitespace-nowrap";
      }
      renderSavedGrid();
    }

    function renderSavedGrid() {
      const grid = document.getElementById('saved-grid');
      const countBadge = document.getElementById('saved-count-badge');

      let filtered = savedGuidesList.filter(guide => {
        const matchesDept = (currentSavedDept === 'All') || 
          ((guide.category || '').toLowerCase().includes(currentSavedDept.toLowerCase()));

        const matchesQuery = !currentSavedQuery ||
          ((guide.title || '').toLowerCase().includes(currentSavedQuery)) ||
          ((guide.summary || '').toLowerCase().includes(currentSavedQuery));

        return matchesDept && matchesQuery;
      });

      countBadge.textContent = `${filtered.length} ${filtered.length === 1 ? 'Guide' : 'Guides'} Saved`;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-16 px-4 bg-surface-container-lowest rounded-3xl border border-outline-variant/30 space-y-3">
            <div class="w-16 h-16 rounded-full bg-surface-container text-primary flex items-center justify-center mx-auto text-3xl">
              <span class="material-symbols-outlined text-3xl">bookmark_border</span>
            </div>
            <h3 class="text-base font-bold text-on-surface">No saved guides in this section</h3>
            <p class="text-xs text-on-surface-variant max-w-sm mx-auto">Explore guides from the home feed or browse page and tap the bookmark icon to save them here.</p>
            <a href="../browse_new_theme/code.html" class="inline-flex items-center gap-1.5 px-4 py-2 bg-primary text-on-primary text-xs font-bold rounded-full shadow-xs hover:bg-primary-container transition-all mt-2">
              <span class="material-symbols-outlined text-sm">explore</span> Browse Departments
            </a>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(guide => {
        const author = guide.author_name || 'Community Member';
        const category = guide.category || 'General';

        return `
          <article id="saved-card-${guide.id}" class="bg-surface-container-lowest rounded-3xl p-5 sm:p-6 border border-outline-variant/30 shadow-xs flex flex-col justify-between group relative">
            <div>
              <div class="flex items-center justify-between gap-2 mb-3">
                <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-secondary-container text-on-secondary-container text-[11px] font-bold">
                  #${escapeHtml(category.toLowerCase())}
                </span>
                <button onclick="removeSavedGuide('${guide.id}')" class="w-8 h-8 rounded-full flex items-center justify-center bg-rose-50 text-rose-600 hover:bg-rose-100 transition-colors" title="Remove bookmark">
                  <span class="material-symbols-outlined text-base fill">bookmark_remove</span>
                </button>
              </div>

              <h3 class="text-base font-bold text-on-surface group-hover:text-primary transition-colors leading-snug mb-2">
                <a href="../guide_detail_new_theme/code.html?id=${guide.id}">
                  ${escapeHtml(guide.title)}
                </a>
              </h3>

              <p class="text-xs text-on-surface-variant line-clamp-3 leading-relaxed mb-4">
                ${escapeHtml(guide.summary || 'Click to view complete guide.')}
              </p>
            </div>

            <div class="pt-4 border-t border-outline-variant/20 flex items-center justify-between">
              <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-bold text-xs uppercase">
                  ${escapeHtml(author.charAt(0))}
                </div>
                <span class="text-xs font-semibold text-on-surface max-w-[110px] truncate">${escapeHtml(author)}</span>
              </div>

              <a href="../guide_detail_new_theme/code.html?id=${guide.id}" class="inline-flex items-center gap-1 px-3.5 py-2 rounded-xl bg-primary text-on-primary text-xs font-bold hover:bg-primary-container hover:text-on-primary-container shadow-xs active:scale-95 transition-all">
                <span>Read</span>
                <span class="material-symbols-outlined text-xs">arrow_forward</span>
              </a>
            </div>
          </article>
        `;
      }).join('');
    }

    async function removeSavedGuide(guideId) {
      if (window.Guidea2zSupabase) {
        await window.Guidea2zSupabase.db.toggleSaveGuide(guideId);
      }
      savedGuidesList = savedGuidesList.filter(g => String(g.id) !== String(guideId));
      renderSavedGrid();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>
</body>
</html>
