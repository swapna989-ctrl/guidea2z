<script>
  let allSavedGuides = [];
  let currentActiveDept = 'All';

  document.addEventListener('DOMContentLoaded', async () => {
    // 1. Sync User Avatar Header from Local Storage
    loadHeaderAvatar();

    // 2. Search & Clear Listeners
    const searchInput = document.getElementById('saved-search-input');
    const clearBtn = document.getElementById('clear-search-btn');

    searchInput?.addEventListener('input', (e) => {
      const val = e.target.value;
      if (val.length > 0) {
        clearBtn?.classList.remove('hidden');
      } else {
        clearBtn?.classList.add('hidden');
      }
      renderFilteredGuides();
    });

    clearBtn?.addEventListener('click', () => {
      if (searchInput) searchInput.value = '';
      clearBtn.classList.add('hidden');
      renderFilteredGuides();
    });

    // 3. Load Saved Guides
    await loadSavedGuides();
  });

  function loadHeaderAvatar() {
    try {
      const savedProfile = localStorage.getItem('guidea2z_profile');
      const savedAvatar = localStorage.getItem('guidea2z_avatar');
      const avatarImg = document.getElementById('header-avatar-img');
      const avatarInitial = document.getElementById('header-avatar-initial');

      if (savedAvatar && avatarImg) {
        avatarImg.src = savedAvatar;
        avatarImg.classList.remove('hidden');
        if (avatarInitial) avatarInitial.classList.add('hidden');
      } else if (savedProfile) {
        const parsed = JSON.parse(savedProfile);
        if (parsed.name && avatarInitial) {
          avatarInitial.textContent = parsed.name.charAt(0).toUpperCase();
        }
      }
    } catch(e) {}
  }

  async function loadSavedGuides() {
    const container = document.getElementById('saved-guides-container');
    if (!container) return;

    try {
      if (window.Guidea2zSupabase) {
        const client = window.Guidea2zSupabase.getSupabase();
        const user = await window.Guidea2zSupabase.auth.getCurrentUser();

        if (client && user) {
          const { data: savedEntries } = await client
            .from('saved_guides')
            .select('guide_id, guides(*)')
            .eq('user_id', user.id);

          if (savedEntries && savedEntries.length > 0) {
            allSavedGuides = savedEntries.map(e => e.guides).filter(Boolean);
            renderFilteredGuides();
            return;
          }
        }
      }

      // Check LocalStorage Saved Guides (Preview / Offline mode)
      const localSaved = localStorage.getItem('guidea2z_saved_guides');
      if (localSaved) {
        const parsed = JSON.parse(localSaved);
        if (Array.isArray(parsed) && parsed.length > 0) {
          allSavedGuides = parsed;
          renderFilteredGuides();
          return;
        }
      }

      // If no guides saved, render empty state
      allSavedGuides = [];
      renderFilteredGuides();

    } catch (err) {
      console.warn('Error loading saved guides:', err);
      allSavedGuides = [];
      renderFilteredGuides();
    }
  }

  function filterSavedDept(dept) {
    currentActiveDept = dept;
    document.querySelectorAll('.dept-filter-pill').forEach(btn => {
      if (btn.getAttribute('data-dept') === dept) {
        btn.className = 'dept-filter-pill px-3.5 py-1.5 rounded-full bg-primary text-on-primary shadow-sm transition-all whitespace-nowrap';
      } else {
        btn.className = 'dept-filter-pill px-3.5 py-1.5 rounded-full bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high border border-outline-variant/30 transition-all whitespace-nowrap';
      }
    });
    renderFilteredGuides();
  }

  function renderFilteredGuides() {
    const container = document.getElementById('saved-guides-container');
    const badge = document.getElementById('saved-count-badge');
    if (!container) return;

    const query = document.getElementById('saved-search-input')?.value?.toLowerCase()?.trim() || '';

    const filtered = allSavedGuides.filter(guide => {
      // Dept filter
      let matchesDept = true;
      if (currentActiveDept !== 'All') {
        const guideCategory = (guide.category || '').toLowerCase();
        const targetDept = currentActiveDept.toLowerCase();
        matchesDept = guideCategory.includes(targetDept) || targetDept.includes(guideCategory);
      }

      // Query filter
      let matchesQuery = true;
      if (query) {
        const titleMatch = (guide.title || '').toLowerCase().includes(query);
        const summaryMatch = (guide.summary || '').toLowerCase().includes(query);
        const catMatch = (guide.category || '').toLowerCase().includes(query);
        matchesQuery = titleMatch || summaryMatch || catMatch;
      }

      return matchesDept && matchesQuery;
    });

    if (badge) {
      badge.textContent = `${filtered.length} ${filtered.length === 1 ? 'Guide' : 'Guides'} Saved`;
    }

    if (filtered.length === 0) {
      renderEmptyState(container, query);
      return;
    }

    container.innerHTML = filtered.map(guide => {
      const author = guide.author_name || 'Community';
      const category = guide.category || 'General';
      const stepsCount = Array.isArray(guide.steps) ? guide.steps.length : 1;

      return `
        <article id="guide-card-${guide.id}" class="guide-card-anim bg-surface-container-lowest rounded-2xl p-5 border border-outline-variant/40 shadow-sm hover:shadow-md hover:-translate-y-1 transition-all flex flex-col justify-between group relative">
          
          <div>
            <!-- Card Header: Category badge + Unsave Bookmark Button -->
            <div class="flex items-center justify-between gap-2 mb-3">
              <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-secondary-container text-on-secondary-container text-xs font-bold">
                <span class="material-symbols-outlined text-xs">tag</span>
                ${escapeHtml(category)}
              </span>

              <!-- Remove / Unbookmark button -->
              <button onclick="handleUnsave('${guide.id}')" title="Remove from saved" class="w-8 h-8 rounded-full flex items-center justify-center text-primary bg-primary-fixed/30 hover:bg-primary hover:text-white transition-colors active:scale-90">
                <span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">bookmark_remove</span>
              </button>
            </div>

            <!-- Title -->
            <h3 class="text-lg font-bold text-on-surface group-hover:text-primary transition-colors leading-snug mb-2">
              <a href="../guide_detail_new_theme/code.html?id=${guide.id}">${escapeHtml(guide.title)}</a>
            </h3>

            <!-- Summary -->
            <p class="text-sm text-on-surface-variant line-clamp-3 leading-relaxed mb-4">
              ${escapeHtml(guide.summary || 'Click below to read the complete breakdown and study tips.')}
            </p>
          </div>

          <!-- Card Footer -->
          <div class="pt-4 border-t border-outline-variant/20 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <div class="w-7 h-7 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-bold text-xs">
                ${escapeHtml(author.charAt(0).toUpperCase())}
              </div>
              <span class="text-xs font-medium text-outline">${escapeHtml(author)}</span>
            </div>

            <a href="../guide_detail_new_theme/code.html?id=${guide.id}" class="inline-flex items-center gap-1 px-4 py-2 rounded-xl bg-primary text-on-primary text-xs font-bold hover:bg-surface-tint active:scale-95 shadow-sm transition-all">
              Read Guide
              <span class="material-symbols-outlined text-xs">arrow_forward</span>
            </a>
          </div>
        </article>
      `;
    }).join('');
  }

  async function handleUnsave(guideId) {
    const card = document.getElementById(`guide-card-${guideId}`);
    if (card) {
      card.style.opacity = '0.3';
      card.style.transform = 'scale(0.95)';
    }

    try {
      if (window.Guidea2zSupabase) {
        await window.Guidea2zSupabase.db.toggleSaveGuide(guideId);
      }

      // Remove from memory
      allSavedGuides = allSavedGuides.filter(g => String(g.id) !== String(guideId));
      localStorage.setItem('guidea2z_saved_guides', JSON.stringify(allSavedGuides));

      setTimeout(() => {
        renderFilteredGuides();
        showToast('Guide removed from your bookmarks');
      }, 250);

    } catch (err) {
      if (card) {
        card.style.opacity = '1';
        card.style.transform = 'none';
      }
      showToast('Could not remove bookmark: ' + (err.message || 'Error'));
    }
  }

  function renderEmptyState(container, query = '') {
    const isFiltered = query.length > 0 || currentActiveDept !== 'All';

    container.innerHTML = `
      <div class="col-span-full text-center py-16 px-4 bg-surface-container-lowest rounded-3xl border border-outline-variant/40 shadow-sm flex flex-col items-center justify-center gap-3">
        <div class="w-16 h-16 rounded-full bg-surface-container-low text-primary flex items-center justify-center mb-1 shadow-inner">
          <span class="material-symbols-outlined text-3xl">${isFiltered ? 'search_off' : 'bookmark_border'}</span>
        </div>
        <h3 class="text-xl font-bold text-on-surface">
          ${isFiltered ? 'No Matching Saved Guides' : 'No Saved Guides Yet'}
        </h3>
        <p class="text-sm text-on-surface-variant max-w-md">
          ${isFiltered 
            ? 'Try changing your search keywords or selecting another department.' 
            : 'Explore study guides across campus and tap the bookmark icon on any guide to save it here for quick offline access!'}
        </p>
        <div class="flex flex-wrap items-center justify-center gap-3 mt-2">
          ${isFiltered ? `
            <button onclick="clearAllFilters()" class="px-5 py-2.5 bg-surface-container-high hover:bg-surface-container-highest text-on-surface text-xs font-bold rounded-full transition-all">
              Clear Filters
            </button>
          ` : `
            <a href="../browse_new_theme/code.html" class="px-6 py-3 bg-primary hover:bg-surface-tint text-on-primary font-bold text-xs rounded-full shadow-md transition-all inline-flex items-center gap-2">
              <span class="material-symbols-outlined text-base">explore</span>
              Browse Departments
            </a>
          `}
        </div>
      </div>
    `;
  }

  function clearAllFilters() {
    const input = document.getElementById('saved-search-input');
    if (input) input.value = '';
    document.getElementById('clear-search-btn')?.classList.add('hidden');
    filterSavedDept('All');
  }

  function showToast(message) {
    const toast = document.getElementById('toast-msg');
    const toastText = document.getElementById('toast-text');
    if (!toast || !toastText) return;

    toastText.textContent = message;
    toast.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
    toast.classList.add('translate-y-0', 'opacity-100', 'pointer-events-auto');

    document.getElementById('toast-close').onclick = () => {
      toast.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
      toast.classList.remove('translate-y-0', 'opacity-100', 'pointer-events-auto');
    };

    setTimeout(() => {
      toast.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
      toast.classList.remove('translate-y-0', 'opacity-100', 'pointer-events-auto');
    }, 3500);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>"']/g, function(m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
    });
  }
</script>
