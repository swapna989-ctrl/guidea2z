<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/theme.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabaseClient.js"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#994530",
            "primary-container": "#f28b71",
            "on-primary": "#ffffff",
            "on-primary-container": "#6c2412",
            "secondary": "#446555",
            "secondary-container": "#c3e8d4",
            "surface": "#fff8f6",
            "surface-container": "#fceae6",
            "surface-container-low": "#fff1ed",
            "surface-container-high": "#f6e4e0",
            "surface-container-lowest": "#ffffff",
            "on-surface": "#221a17",
            "on-surface-variant": "#55433e",
            "outline": "#88726d",
            "outline-variant": "#dbc1bb",
            "background": "#fff8f6"

          fontFamily: {

  <style>

      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1;
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
    .dept-active {
      background-color: #994530 !important;
      color: #ffffff !important;
      border-color: #994530 !important;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(153, 69, 48, 0.2);
    }
    .dept-active * {
      color: #ffffff !important;
    }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-sans antialiased selection:bg-primary-container selection:text-on-primary-container pb-24 md:pb-12">

  <!-- Top Header -->

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      
      <a href="../index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-primary text-white flex items-center justify-center font-extrabold text-xl shadow-md">
          g
        </div>
        <span class="font-extrabold text-xl text-primary tracking-tight">guidea2z</span>
      </a>

      <!-- Search Bar -->
      <div class="flex-1 max-w-md mx-4">
        <div class="relative w-full">
          <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-outline text-lg pointer-events-none">search</span>
          <input 
            type="text" 
            id="browse-search" 
            placeholder="Search all department guides..." 
            class="w-full pl-10 pr-4 py-2 bg-surface-container-lowest border border-outline-variant/60 rounded-full text-xs text-on-surface placeholder:text-outline/70 focus:outline-none focus:ring-2 focus:ring-primary/30"
          />
        </div>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-2">
        <button type="button" class="theme-toggle-btn w-9 h-9 flex items-center justify-center rounded-full bg-surface-container hover:bg-surface-container-high text-on-surface-variant hover:text-primary transition-colors active:scale-95 duration-200" title="Toggle Dark/Light Mode">
          <span class="material-symbols-outlined text-lg theme-toggle-icon">dark_mode</span>
        </button>
        <a href="../account_settings/code.html" class="w-9 h-9 rounded-full bg-primary text-white flex items-center justify-center font-bold text-xs shadow-xs">
          <span class="material-symbols-outlined text-base">person</span>
        </a>
      </div>

    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 space-y-8 flex-1">
    
    <!-- Title -->
    <div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-on-surface tracking-tight">
        Browse by Department
      </h1>
      <p class="text-xs sm:text-sm text-on-surface-variant mt-1">
        Select your branch or category to explore syllabus breakdown, lab notes, and exam prep.
      </p>
    </div>

    <!-- Department Grid Selector -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3" id="dept-cards-grid">
      <!-- All -->
      <button onclick="selectDept('All', this)" class="dept-card dept-active p-4 rounded-2xl bg-surface-container-lowest border border-outline-variant/50 text-left hover:bg-surface-container transition-all flex flex-col justify-between h-28 shadow-2xs">
        <span class="material-symbols-outlined text-2xl text-primary">apps</span>
        <div>
          <div class="font-extrabold text-sm text-on-surface">All Branches</div>
          <div class="text-[10px] text-outline">Complete library</div>
        </div>
      </button>

      <!-- CSE -->
      <button onclick="selectDept('CSE', this)" class="dept-card p-4 rounded-2xl bg-surface-container-lowest border border-outline-variant/50 text-left hover:bg-surface-container transition-all flex flex-col justify-between h-28 shadow-2xs">
        <span class="material-symbols-outlined text-2xl text-primary">computer</span>
        <div>
          <div class="font-extrabold text-sm text-on-surface">CSE</div>
          <div class="text-[10px] text-outline">Comp. Science</div>
        </div>
      </button>

      <!-- CSM -->
      <button onclick="selectDept('CSM', this)" class="dept-card p-4 rounded-2xl bg-surface-container-lowest border border-outline-variant/50 text-left hover:bg-surface-container transition-all flex flex-col justify-between h-28 shadow-2xs">
        <span class="material-symbols-outlined text-2xl text-secondary">psychology</span>
        <div>
          <div class="font-extrabold text-sm text-on-surface">CSM</div>
          <div class="text-[10px] text-outline">AI & Machine Learning</div>
        </div>
      </button>

      <!-- CSD -->
      <button onclick="selectDept('CSD', this)" class="dept-card p-4 rounded-2xl bg-surface-container-lowest border border-outline-variant/50 text-left hover:bg-surface-container transition-all flex flex-col justify-between h-28 shadow-2xs">
        <span class="material-symbols-outlined text-2xl text-primary">analytics</span>
        <div>
          <div class="font-extrabold text-sm text-on-surface">CSD</div>
          <div class="text-[10px] text-outline">Data Science</div>
        </div>
      </button>

      <!-- IT -->
      <button onclick="selectDept('IT', this)" class="dept-card p-4 rounded-2xl bg-surface-container-lowest border border-outline-variant/50 text-left hover:bg-surface-container transition-all flex flex-col justify-between h-28 shadow-2xs">
        <span class="material-symbols-outlined text-2xl text-secondary">language</span>
        <div>
          <div class="font-extrabold text-sm text-on-surface">IT</div>
          <div class="text-[10px] text-outline">Info. Tech</div>
        </div>
      </button>

      <!-- ECE -->
      <button onclick="selectDept('ECE', this)" class="dept-card p-4 rounded-2xl bg-surface-container-lowest border border-outline-variant/50 text-left hover:bg-surface-container transition-all flex flex-col justify-between h-28 shadow-2xs">
        <span class="material-symbols-outlined text-2xl text-primary">memory</span>
        <div>
          <div class="font-extrabold text-sm text-on-surface">ECE</div>
          <div class="text-[10px] text-outline">Electronics & Comm.</div>
        </div>
      </button>

      <!-- EEE -->
      <button onclick="selectDept('EEE', this)" class="dept-card p-4 rounded-2xl bg-surface-container-lowest border border-outline-variant/50 text-left hover:bg-surface-container transition-all flex flex-col justify-between h-28 shadow-2xs">
        <span class="material-symbols-outlined text-2xl text-secondary">bolt</span>
        <div>
          <div class="font-extrabold text-sm text-on-surface">EEE</div>
          <div class="text-[10px] text-outline">Electrical Engg.</div>
        </div>
      </button>

      <!-- MECH -->
      <button onclick="selectDept('MECH', this)" class="dept-card p-4 rounded-2xl bg-surface-container-lowest border border-outline-variant/50 text-left hover:bg-surface-container transition-all flex flex-col justify-between h-28 shadow-2xs">
        <span class="material-symbols-outlined text-2xl text-primary">precision_manufacturing</span>
        <div>
          <div class="font-extrabold text-sm text-on-surface">Mechanical</div>
          <div class="text-[10px] text-outline">CAD / CAM</div>
        </div>
      </button>

      <!-- Civil -->
      <button onclick="selectDept('Civil', this)" class="dept-card p-4 rounded-2xl bg-surface-container-lowest border border-outline-variant/50 text-left hover:bg-surface-container transition-all flex flex-col justify-between h-28 shadow-2xs">
        <span class="material-symbols-outlined text-2xl text-secondary">domain</span>
        <div>
          <div class="font-extrabold text-sm text-on-surface">Civil</div>
          <div class="text-[10px] text-outline">Structures & Survey</div>
        </div>
      </button>

      <!-- Placement -->
      <button onclick="selectDept('Placement', this)" class="dept-card p-4 rounded-2xl bg-surface-container-lowest border border-outline-variant/50 text-left hover:bg-surface-container transition-all flex flex-col justify-between h-28 shadow-2xs">
        <span class="material-symbols-outlined text-2xl text-primary">work</span>
        <div>
          <div class="font-extrabold text-sm text-on-surface">Placements</div>
          <div class="text-[10px] text-outline">DSA & Interviews</div>
        </div>
      </button>

      <!-- Others -->
      <button onclick="selectDept('General', this)" class="dept-card p-4 rounded-2xl bg-surface-container-lowest border border-outline-variant/50 text-left hover:bg-surface-container transition-all flex flex-col justify-between h-28 shadow-2xs">
        <span class="material-symbols-outlined text-2xl text-secondary">school</span>
        <div>
          <div class="font-extrabold text-sm text-on-surface">General</div>
          <div class="text-[10px] text-outline">Campus & Events</div>
        </div>
      </button>
    </div>

    <!-- Results Section -->
    <section class="space-y-4">
      <div class="flex items-center justify-between">
        <h2 id="dept-results-heading" class="text-lg font-extrabold text-on-surface tracking-tight">
          All Guides
        </h2>
        <span id="browse-count-badge" class="px-2.5 py-1 bg-surface-container-high rounded-full text-xs font-bold text-primary">
          Loading...
        </span>
      </div>

      <div id="browse-guides-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
        <!-- Rendered via JS -->
      </div>
    </section>

  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-surface/95 backdrop-blur-lg border-t border-outline-variant/30 shadow-lg pb-safe">
    <div class="flex justify-around items-center h-16 px-2">
      <a href="../index.html" class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary active:scale-95 transition-all w-16">
        <span class="material-symbols-outlined text-2xl">home</span>
        <span class="text-[10px] mt-0.5">Home</span>
      </a>
      <a href="../browse_new_theme/code.html" class="flex flex-col items-center justify-center text-primary font-bold active:scale-95 transition-all w-16">
        <span class="material-symbols-outlined text-2xl fill">explore</span>
        <span class="text-[10px] mt-0.5 font-bold">Browse</span>
      </a>
      <a href="../post_guide_new_theme/code.html" class="flex flex-col items-center justify-center -translate-y-2 group">
        <div class="w-12 h-12 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-lg group-active:scale-90 transition-transform">
          <span class="material-symbols-outlined text-2xl font-bold">add</span>
        </div>
        <span class="text-[10px] font-bold text-primary mt-1">Post</span>
      </a>
      <a href="../saved_guides/code.html" class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary active:scale-95 transition-all w-16">
        <span class="material-symbols-outlined text-2xl">bookmark</span>
        <span class="text-[10px] mt-0.5">Saved</span>
      </a>
      <a href="../account_settings/code.html" class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary active:scale-95 transition-all w-16">
        <span class="material-symbols-outlined text-2xl">person</span>
        <span class="text-[10px] mt-0.5">Profile</span>
      </a>
    </div>
  </nav>

  <script>
    let browseGuides = [];
    let selectedDeptName = 'All';
    let browseSearchTerm = '';

    document.addEventListener('DOMContentLoaded', async () => {
      // Check URL parameters for initial dept/query
      const urlParams = new URLSearchParams(window.location.search);
      const deptParam = urlParams.get('dept');
      const qParam = urlParams.get('q');

      if (deptParam) selectedDeptName = deptParam;
      if (qParam) {
        browseSearchTerm = qParam.trim().toLowerCase();
        document.getElementById('browse-search').value = qParam;
      }

      await loadBrowseGuides();

      // Search input handler
      document.getElementById('browse-search').addEventListener('input', (e) => {
        browseSearchTerm = e.target.value.trim().toLowerCase();
        renderBrowseGrid();
      });
    });

    async function loadBrowseGuides() {
      try {
        if (window.Guidea2zSupabase) {
          browseGuides = await window.Guidea2zSupabase.db.fetchGuides();
        }
        if (!browseGuides || browseGuides.length === 0) {
          browseGuides = window.Guidea2zSupabase?.STARTER_GUIDES || [];
        }
      } catch (e) {
        browseGuides = window.Guidea2zSupabase?.STARTER_GUIDES || [];
      }
      renderBrowseGrid();
    }

    function selectDept(dept, cardElement) {
      selectedDeptName = dept;

      // Update Card Styles
      document.querySelectorAll('.dept-card').forEach(c => {
        c.className = "dept-card p-4 rounded-2xl bg-surface-container-lowest border border-outline-variant/50 text-left hover:bg-surface-container transition-all flex flex-col justify-between h-28 shadow-2xs";
      });

      if (cardElement) {
        cardElement.className = "dept-card dept-active p-4 rounded-2xl bg-surface-container-lowest border border-outline-variant/50 text-left hover:bg-surface-container transition-all flex flex-col justify-between h-28 shadow-2xs";
      }

      renderBrowseGrid();
    }

    function renderBrowseGrid() {
      const grid = document.getElementById('browse-guides-grid');
      const heading = document.getElementById('dept-results-heading');
      const badge = document.getElementById('browse-count-badge');

      heading.textContent = selectedDeptName === 'All' ? 'All Guides' : `${selectedDeptName} Study Guides`;

      let filtered = browseGuides.filter(guide => {
        const matchesDept = (selectedDeptName === 'All') || 
          ((guide.category || '').toLowerCase().includes(selectedDeptName.toLowerCase()));

        const matchesQuery = !browseSearchTerm ||
          ((guide.title || '').toLowerCase().includes(browseSearchTerm)) ||
          ((guide.summary || '').toLowerCase().includes(browseSearchTerm)) ||
          ((guide.category || '').toLowerCase().includes(browseSearchTerm));

        return matchesDept && matchesQuery;
      });

      badge.textContent = `${filtered.length} ${filtered.length === 1 ? 'Guide' : 'Guides'}`;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-16 px-4 bg-surface-container-lowest rounded-3xl border border-outline-variant/30 space-y-3">
            <div class="w-16 h-16 rounded-full bg-surface-container text-primary flex items-center justify-center mx-auto text-3xl">
              <span class="material-symbols-outlined text-3xl">search_off</span>
            </div>
            <h3 class="text-base font-bold text-on-surface">No guides found</h3>
            <p class="text-xs text-on-surface-variant max-w-sm mx-auto">No published guides matching this department or query yet.</p>
            <a href="../post_guide_new_theme/code.html" class="inline-flex items-center gap-1.5 px-4 py-2 bg-primary text-on-primary text-xs font-bold rounded-full shadow-xs hover:bg-primary-container transition-all mt-2">
              <span class="material-symbols-outlined text-sm">add</span> Post New Guide
            </a>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(guide => {
        const author = guide.author_name || 'Community Member';
        const category = guide.category || 'General';
        const stepsCount = Array.isArray(guide.steps) ? guide.steps.length : 1;

        return `
          <article class="bg-surface-container-lowest rounded-3xl p-5 sm:p-6 border border-outline-variant/30 shadow-xs hover:shadow-md hover:-translate-y-1 transition-all flex flex-col justify-between group relative">
            <div>
              <div class="flex items-center justify-between gap-2 mb-3">
                <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-secondary-container text-on-secondary-container text-[11px] font-bold">
                  #${escapeHtml(category.toLowerCase())}
                </span>
                <span class="text-[11px] font-semibold text-outline">
                  ${stepsCount} ${stepsCount === 1 ? 'step' : 'steps'}
                </span>
              </div>

              <h3 class="text-base font-bold text-on-surface group-hover:text-primary transition-colors leading-snug mb-2">
                <a href="../guide_detail_new_theme/code.html?id=${guide.id}">
                  ${escapeHtml(guide.title)}
                </a>
              </h3>

              <p class="text-xs text-on-surface-variant line-clamp-3 leading-relaxed mb-4">
                ${escapeHtml(guide.summary || 'Click below to read full guide.')}
              </p>
            </div>

            <div class="pt-4 border-t border-outline-variant/20 flex items-center justify-between">
              <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-bold text-xs uppercase">
                  ${escapeHtml(author.charAt(0))}
                </div>
                <span class="text-xs font-semibold text-on-surface max-w-[110px] truncate">${escapeHtml(author)}</span>
              </div>

              <a href="../guide_detail_new_theme/code.html?id=${guide.id}" class="inline-flex items-center gap-1 px-3.5 py-2 rounded-xl bg-primary text-on-primary text-xs font-bold hover:bg-primary-container hover:text-on-primary-container shadow-xs active:scale-95 transition-all">
                <span>Read</span>
                <span class="material-symbols-outlined text-xs">arrow_forward</span>
              </a>
            </div>
          </article>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>
</body>
</html>
