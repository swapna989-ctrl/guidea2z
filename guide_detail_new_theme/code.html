<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Guide Detail - guidea2z</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/theme.css">
  <script src="../js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabaseClient.js"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#994530",
            "primary-container": "#f28b71",
            "on-primary": "#ffffff",
            "on-primary-container": "#6c2412",
            "secondary": "#446555",
            "secondary-container": "#c3e8d4",
            "surface": "#fff8f6",
            "surface-container": "#fceae6",
            "surface-container-low": "#fff1ed",
            "surface-container-high": "#f6e4e0",
            "surface-container-lowest": "#ffffff",
            "on-surface": "#221a17",
            "on-surface-variant": "#55433e",
            "outline": "#88726d",
            "outline-variant": "#dbc1bb",
            "background": "#fff8f6"
          },
          fontFamily: {
            sans: ["Hanken Grotesk", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"]
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1;
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-sans antialiased selection:bg-primary-container selection:text-on-primary-container pb-24 md:pb-12">

  <!-- Top Navigation Bar -->
  <header class="sticky top-0 z-40 bg-surface/90 backdrop-blur-md border-b border-outline-variant/30 shadow-xs">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      
      <div class="flex items-center gap-3">
        <button id="back-btn" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-surface-container active:scale-95 transition-all text-on-surface">
          <span class="material-symbols-outlined text-xl">arrow_back</span>
        </button>
        <a href="../index.html" class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-primary text-white flex items-center justify-center font-extrabold text-sm shadow-xs">g</div>
          <span class="font-extrabold text-lg text-primary tracking-tight">guidea2z</span>
        </a>
      </div>

      <!-- Action Buttons (Bookmark, Share, Theme) -->
      <div class="flex items-center gap-2">
        <button id="bookmark-btn" class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container hover:bg-surface-container-high text-on-surface-variant hover:text-primary active:scale-95 transition-all shadow-2xs" title="Save Guide">
          <span id="bookmark-icon" class="material-symbols-outlined text-xl">bookmark</span>
        </button>
        <button id="share-btn" class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container hover:bg-surface-container-high text-on-surface-variant hover:text-primary active:scale-95 transition-all shadow-2xs" title="Share Guide">
          <span class="material-symbols-outlined text-xl">share</span>
        </button>
        <button type="button" class="theme-toggle-btn w-10 h-10 flex items-center justify-center rounded-full bg-surface-container hover:bg-surface-container-high text-on-surface-variant hover:text-primary transition-colors active:scale-95 duration-200" title="Toggle Dark/Light Mode">
          <span class="material-symbols-outlined text-xl theme-toggle-icon">dark_mode</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 pt-6 flex-1 w-full space-y-6">
    
    <!-- Guide Article Card -->
    <article class="bg-surface-container-lowest rounded-3xl p-6 sm:p-8 border border-outline-variant/30 shadow-xs space-y-6">
      
      <!-- Top Meta Tags & Likes -->
      <div class="flex items-center justify-between flex-wrap gap-2 pb-4 border-b border-outline-variant/20">
        <div class="flex items-center gap-2">
          <span id="guide-category-tag" class="px-3 py-1 rounded-full bg-secondary-container text-on-secondary-container text-xs font-bold uppercase tracking-wider">
            #loading
          </span>
          <span id="guide-location-tag" class="text-xs text-outline font-semibold flex items-center gap-1">
            <span class="material-symbols-outlined text-sm">location_on</span>
            <span id="guide-location">Campus</span>
          </span>
        </div>

        <!-- Like Button -->
        <button id="like-btn" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-surface-container hover:bg-surface-container-high text-on-surface font-bold text-xs active:scale-95 transition-all shadow-2xs">
          <span id="like-icon" class="material-symbols-outlined text-rose-500 text-base">favorite</span>
          <span id="likes-count">0</span>
        </button>
      </div>

      <!-- Title -->
      <h1 id="guide-title" class="text-2xl sm:text-4xl font-extrabold text-on-surface tracking-tight leading-tight">
        Loading Guide...
      </h1>

      <!-- Author Bio Row -->
      <div class="flex items-center gap-3 p-3 bg-surface-container-low rounded-2xl border border-outline-variant/20">
        <div id="author-avatar-initial" class="w-11 h-11 rounded-full bg-primary text-white flex items-center justify-center font-bold text-lg shadow-2xs">
          A
        </div>
        <div>
          <div id="author-name" class="font-bold text-sm text-on-surface">Community Member</div>
          <div id="guide-meta" class="text-xs text-outline">Verified Campus Guide</div>
        </div>
      </div>

      <!-- Summary -->
      <div id="guide-summary-box" class="p-4 bg-primary/5 border-l-4 border-primary rounded-r-2xl text-xs sm:text-sm text-on-surface leading-relaxed font-medium">
        Loading summary...
      </div>

      <!-- Step-by-Step Sections -->
      <div class="space-y-4">
        <h2 class="text-lg font-extrabold text-on-surface flex items-center gap-2">
          <span class="material-symbols-outlined text-primary">checklist</span>
          Actionable Guide Steps
        </h2>
        <div id="guide-steps-container" class="space-y-3">
          <!-- Dynamically populated -->
        </div>
      </div>

    </article>

    <!-- Discussion / Comments Section -->
    <section class="bg-surface-container-lowest rounded-3xl p-6 sm:p-8 border border-outline-variant/30 shadow-xs space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-extrabold text-on-surface flex items-center gap-2">
          <span class="material-symbols-outlined text-secondary">forum</span>
          Student Discussion (<span id="comments-count">0</span>)
        </h2>
      </div>

      <!-- Comment Box -->
      <form id="comment-form" class="space-y-3">
        <textarea 
          id="comment-text" 
          rows="3" 
          placeholder="Ask a question, share a tip, or thank the author..." 
          class="w-full p-3.5 bg-surface-container-low border border-outline-variant/60 rounded-2xl text-xs sm:text-sm text-on-surface placeholder:text-outline/70 focus:outline-none focus:ring-2 focus:ring-primary/30 resize-none"
          required
        ></textarea>
        <div class="flex justify-end">
          <button type="submit" class="px-5 py-2.5 bg-primary hover:bg-primary-container text-on-primary hover:text-on-primary-container rounded-full text-xs font-bold shadow-xs active:scale-95 transition-all flex items-center gap-1.5">
            <span>Post Comment</span>
            <span class="material-symbols-outlined text-sm font-bold">send</span>
          </button>
        </div>
      </form>

      <!-- Comments List -->
      <div id="comments-list" class="space-y-3 pt-2">
        <!-- Dynamically populated -->
      </div>
    </section>

  </main>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 bg-slate-900 text-white text-xs font-bold rounded-full shadow-xl transition-all duration-300 opacity-0 pointer-events-none translate-y-4">
    Link copied to clipboard!
  </div>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-surface/95 backdrop-blur-lg border-t border-outline-variant/30 shadow-lg pb-safe">
    <div class="flex justify-around items-center h-16 px-2">
      <a href="../index.html" class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary active:scale-95 transition-all w-16">
        <span class="material-symbols-outlined text-2xl">home</span>
        <span class="text-[10px] mt-0.5">Home</span>
      </a>
      <a href="../browse_new_theme/code.html" class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary active:scale-95 transition-all w-16">
        <span class="material-symbols-outlined text-2xl">explore</span>
        <span class="text-[10px] mt-0.5">Browse</span>
      </a>
      <a href="../post_guide_new_theme/code.html" class="flex flex-col items-center justify-center -translate-y-2 group">
        <div class="w-12 h-12 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-lg group-active:scale-90 transition-transform">
          <span class="material-symbols-outlined text-2xl font-bold">add</span>
        </div>
        <span class="text-[10px] font-bold text-primary mt-1">Post</span>
      </a>
      <a href="../saved_guides/code.html" class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary active:scale-95 transition-all w-16">
        <span class="material-symbols-outlined text-2xl">bookmark</span>
        <span class="text-[10px] mt-0.5">Saved</span>
      </a>
      <a href="../account_settings/code.html" class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary active:scale-95 transition-all w-16">
        <span class="material-symbols-outlined text-2xl">person</span>
        <span class="text-[10px] mt-0.5">Profile</span>
      </a>
    </div>
  </nav>

  <script>
    let currentGuide = null;
    let comments = [];
    let isLiked = false;

    document.addEventListener('DOMContentLoaded', async () => {
      // Back button handler
      document.getElementById('back-btn').addEventListener('click', () => {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = '../index.html';
        }
      });

      // Share button handler
      document.getElementById('share-btn').addEventListener('click', () => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(window.location.href);
          showToast('Guide link copied to clipboard! 📋');
        }
      });

      // Load Guide
      const urlParams = new URLSearchParams(window.location.search);
      const guideId = urlParams.get('id') || 'starter-1';
      await loadGuideDetail(guideId);

      // Setup Comment Form
      document.getElementById('comment-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('comment-text');
        const text = input.value.trim();
        if (!text) return;

        const profile = JSON.parse(localStorage.getItem('guidea2z_profile') || '{}');
        const authorName = profile.name || 'Student';

        const newComment = {
          id: 'c-' + Date.now(),
          author: authorName,
          text: text,
          time: 'Just now'
        };

        comments.unshift(newComment);
        input.value = '';
        saveAndRenderComments(guideId);
        showToast('Comment posted! 💬');
      });
    });

    async function loadGuideDetail(guideId) {
      if (window.Guidea2zSupabase) {
        currentGuide = await window.Guidea2zSupabase.db.fetchGuideById(guideId);
      }

      if (!currentGuide) {
        // Search in starters
        const starters = window.Guidea2zSupabase?.STARTER_GUIDES || [];
        currentGuide = starters.find(g => String(g.id) === String(guideId)) || starters[0];
      }

      if (currentGuide) {
        renderGuideUI(currentGuide);
        initLikeAndBookmark(currentGuide.id);
        loadComments(currentGuide.id);
      }
    }

    function renderGuideUI(guide) {
      document.title = `${guide.title} - guidea2z`;
      document.getElementById('guide-title').textContent = guide.title;
      document.getElementById('guide-category-tag').textContent = `#${(guide.category || 'General').toLowerCase()}`;
      document.getElementById('guide-location').textContent = guide.location || 'Main Campus';
      
      const author = guide.author_name || 'Community Member';
      document.getElementById('author-name').textContent = author;
      document.getElementById('author-avatar-initial').textContent = author.charAt(0).toUpperCase();

      document.getElementById('guide-summary-box').textContent = guide.summary || 'Follow the step-by-step points below.';

      // Steps
      const stepsContainer = document.getElementById('guide-steps-container');
      const steps = Array.isArray(guide.steps) && guide.steps.length > 0 ? guide.steps : [
        'Review the key concepts and lecture slides.',
        'Solve previous year questions and practice numericals.',
        'Summarize formulas and revise with study group.'
      ];

      stepsContainer.innerHTML = steps.map((step, idx) => `
        <div class="p-4 bg-surface-container-low rounded-2xl border border-outline-variant/30 flex items-start gap-3.5">
          <div class="w-7 h-7 rounded-full bg-primary text-white flex items-center justify-center font-bold text-xs shrink-0 mt-0.5 shadow-2xs">
            ${idx + 1}
          </div>
          <div class="text-xs sm:text-sm text-on-surface leading-relaxed font-medium">
            ${escapeHtml(step)}
          </div>
        </div>
      `).join('');
    }

    async function initLikeAndBookmark(guideId) {
      const likeBtn = document.getElementById('like-btn');
      const likeIcon = document.getElementById('like-icon');
      const likesCountSpan = document.getElementById('likes-count');
      let count = currentGuide?.likes_count || 18;
      likesCountSpan.textContent = count;

      likeBtn.addEventListener('click', () => {
        isLiked = !isLiked;
        if (isLiked) {
          likeIcon.classList.add('fill');
          count += 1;
          showToast('Liked guide! ❤️');
        } else {
          likeIcon.classList.remove('fill');
          count -= 1;
        }
        likesCountSpan.textContent = count;
      });

      // Bookmark
      const bookmarkBtn = document.getElementById('bookmark-btn');
      const bookmarkIcon = document.getElementById('bookmark-icon');

      try {
        const savedGuides = await window.Guidea2zSupabase.db.fetchSavedGuides();
        const isSaved = savedGuides.some(g => String(g.id) === String(guideId));
        if (isSaved) {
          bookmarkIcon.classList.add('fill');
          bookmarkIcon.classList.add('text-primary');
        }
      } catch (e) {}

      bookmarkBtn.addEventListener('click', async () => {
        try {
          const savedNow = await window.Guidea2zSupabase.db.toggleSaveGuide(guideId);
          if (savedNow) {
            bookmarkIcon.classList.add('fill');
            bookmarkIcon.classList.add('text-primary');
            showToast('Saved to your bookmarks! 🔖');
          } else {
            bookmarkIcon.classList.remove('fill');
            bookmarkIcon.classList.remove('text-primary');
            showToast('Removed from bookmarks');
          }
        } catch (e) {
          showToast('Bookmark updated');
        }
      });
    }

    function loadComments(guideId) {
      const stored = localStorage.getItem(`guidea2z_comments_${guideId}`);
      if (stored) {
        comments = JSON.parse(stored);
      } else {
        // Starter comments for realistic demonstration
        comments = [
          { id: 'c1', author: 'Pooja Nair', text: 'This was super helpful for our semester revision, thanks for sharing!', time: '2 hours ago' },
          { id: 'c2', author: 'Dev Sharma', text: 'Step 2 solved the exact issue I was facing in the lab test.', time: 'Yesterday' }
        ];
      }
      renderComments();
    }

    function saveAndRenderComments(guideId) {
      localStorage.setItem(`guidea2z_comments_${guideId}`, JSON.stringify(comments));
      renderComments();
    }

    function renderComments() {
      const list = document.getElementById('comments-list');
      const count = document.getElementById('comments-count');
      count.textContent = comments.length;

      if (comments.length === 0) {
        list.innerHTML = `<p class="text-xs text-outline py-2">No comments yet. Be the first to share your feedback!</p>`;
        return;
      }

      list.innerHTML = comments.map(c => `
        <div class="p-3.5 bg-surface-container-low rounded-2xl border border-outline-variant/20 flex items-start gap-3">
          <div class="w-8 h-8 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center font-bold text-xs shrink-0">
            ${escapeHtml(c.author.charAt(0))}
          </div>
          <div class="flex-1">
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs font-bold text-on-surface">${escapeHtml(c.author)}</span>
              <span class="text-[10px] text-outline font-semibold">${escapeHtml(c.time)}</span>
            </div>
            <p class="text-xs text-on-surface-variant leading-relaxed">${escapeHtml(c.text)}</p>
          </div>
        </div>
      `).join('');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2500);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>
</body>
</html>
