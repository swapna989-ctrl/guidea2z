<script>
  // Fallback guides from Browse — used to render preview when ID is not a UUID
  const FALLBACK_GUIDES = {
    'cse-1': { title: 'Data Structures & Algorithms in Java', category: 'CSE', author_name: 'Swapna Kumari', summary: 'Complete roadmap for cracking college lab exams, tree traversals, graphs, and dynamic programming.', steps: ['Master Recursion & Pointer manipulation', 'Practice Sorting & Binary Search', 'Solve LeetCode Top 50'] },
    'csm-1': { title: 'Machine Learning & Neural Networks 101', category: 'CSM', author_name: 'Rahul Sharma', summary: 'Hands-on guide to PyTorch, TensorFlow, Gradient Descent, and building your first CNN image classifier.', steps: ['Install Python & Anaconda Environment', 'Understand Forward & Backward Propagation', 'Deploy on HuggingFace'] },
    'csd-1': { title: 'Data Science & Big Data Analytics', category: 'CSD', author_name: 'Priya Patel', summary: 'End-to-end data pipelines using Pandas, NumPy, SQL, and PowerBI visualization templates.', steps: ['Clean missing data with Pandas', 'Build interactive dashboards', 'Run exploratory analysis'] },
    'csc-1': { title: 'Network Security & Ethical Hacking Labs', category: 'CSC', author_name: 'Vikram Rao', summary: 'Guide to Wireshark packet analysis, cryptography ciphers, and securing Linux servers.', steps: ['Setup Kali Linux VM', 'Capture packets in Wireshark', 'Implement RSA & AES Encryption'] },
    'csbs-1': { title: 'Business Systems & Agile Software Delivery', category: 'CSBS', author_name: 'Sneha Roy', summary: 'How to combine software development with financial modeling and enterprise ERP systems.', steps: ['Design ER Diagrams for Enterprise', 'Manage Jira Agile Sprints', 'Financial Tech Integration'] },
    'it-1': { title: 'Full Stack Web Architecture & Cloud DevOps', category: 'IT', author_name: 'Aditya Kumar', summary: 'Building RESTful APIs with Node.js, Express, Docker containers, and AWS S3 storage.', steps: ['Create Modular Express Routes', 'Containerize with Docker', 'Deploy to Cloud Hosting'] },
    'ece-1': { title: 'VLSI Design & Digital Signal Processing', category: 'ECE', author_name: 'Ananya Reddy', summary: 'Verilog HDL coding tips, MATLAB signal filters, and microcontroller circuit design.', steps: ['Write Verilog Testbenches', 'Design Butterworth Lowpass Filters', 'Simulate in Modelsim'] },
    'eee-1': { title: 'Power Systems & Electrical Machines Guide', category: 'EEE', author_name: 'Karthik Nair', summary: 'Detailed lab notes on transformers, induction motors, power grid stability, and MATLAB Simulink.', steps: ['Understand Transformer Equivalent Circuits', 'Simulate Power Factor Correction', 'Calculate Motor Efficiency'] },
    'mech-1': { title: 'Thermodynamics & AutoCAD Engineering Drawing', category: 'Mechanical', author_name: 'Rohan Gupta', summary: 'Carnot cycle equations, 3D modeling in SolidWorks, and IC engine test procedures.', steps: ['Learn Isometric Projections in AutoCAD', 'Calculate Enthalpy & Entropy', 'Perform Stress Analysis'] },
    'civil-1': { title: 'Structural Analysis & Concrete Technology', category: 'Civil', author_name: 'Meera Menon', summary: 'Shear force & bending moment diagrams, surveying with Total Station, and mix design.', steps: ['Draw SFD and BMD for Beams', 'Conduct Slump Cone Test for Concrete', 'Plan Leveling in Total Station'] },
    'chem-1': { title: 'Chemical Reaction Engineering & Heat Transfer', category: 'Chemical', author_name: 'Arjun Das', summary: 'Design of CSTR and PFR reactors, distillation column mass transfer, and thermodynamics.', steps: ['Balance Heat Exchanger Equations', 'Calculate Reactor Residence Time', 'Execute Lab Titration'] },
    'other-1': { title: 'Campus Placement Prep & Resume Blueprint', category: 'Others', author_name: 'guidea2z Team', summary: 'A to Z blueprint on aptitude tests, technical interview rounds, and building an ATS-proof resume.', steps: ['Format Clean Single-Page Resume', 'Solve Quantitative Aptitude Daily', 'Ace HR Behavioral Questions'] }
  };

  // UUID format check
  function isUUID(str) {
    return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(str);
  }

  document.addEventListener('DOMContentLoaded', async () => {
    // Back button
    document.getElementById('back-btn')?.addEventListener('click', () => {
      if (document.referrer) {
        window.history.back();
      } else {
        window.location.href = '../home_feed_new_theme/code.html';
      }
    });

    // Load profile avatar initial from localStorage
    try {
      const saved = localStorage.getItem('guidea2z_profile');
      if (saved) {
        const p = JSON.parse(saved);
        if (p.name) document.getElementById('header-avatar-initial').textContent = p.name.charAt(0).toUpperCase();
      }
    } catch(e) {}

    const urlParams = new URLSearchParams(window.location.search);
    const guideId = urlParams.get('id') || 'starter-1';

    let activeGuide = null;

    if (window.Guidea2zSupabase) {
      try {
        activeGuide = await window.Guidea2zSupabase.db.fetchGuideById(guideId);
      } catch (err) {
        console.warn('Error querying guide:', err);
      }
    }

    if (!activeGuide && FALLBACK_GUIDES[guideId]) {
      const fb = FALLBACK_GUIDES[guideId];
      activeGuide = {
        id: guideId,
        title: fb.title,
        category: fb.category,
        author_name: fb.author_name,
        summary: fb.summary,
        steps: fb.steps,
        created_at: new Date().toISOString()
      };
    }

    if (activeGuide) {
      renderGuide(activeGuide, true);
    } else {
      renderNotFound();
      return;
    }

    // ── Bookmark Toggle ──
    const bookmarkBtn = document.getElementById('bookmark-btn');
    const bookmarkIcon = document.getElementById('bookmark-icon');
    
    // Check initial saved status
    if (window.Guidea2zSupabase && activeGuide) {
      try {
        const savedGuides = await window.Guidea2zSupabase.db.fetchSavedGuides();
        const alreadySaved = savedGuides.some(g => String(g.id) === String(activeGuide.id));
        if (alreadySaved && bookmarkIcon && bookmarkBtn) {
          bookmarkIcon.style.fontVariationSettings = "'FILL' 1";
          bookmarkBtn.classList.add('bg-primary-container', 'text-on-primary-container');
        }
      } catch (e) {}
    }

    if (bookmarkBtn && activeGuide) {
      bookmarkBtn.addEventListener('click', async () => {
        try {
          if (!window.Guidea2zSupabase) return;
          const isSaved = await window.Guidea2zSupabase.db.toggleSaveGuide(activeGuide.id);
          if (isSaved) {
            bookmarkIcon.style.fontVariationSettings = "'FILL' 1";
            bookmarkBtn.classList.add('bg-primary-container', 'text-on-primary-container');
          } else {
            bookmarkIcon.style.fontVariationSettings = "'FILL' 0";
            bookmarkBtn.classList.remove('bg-primary-container', 'text-on-primary-container');
          }
        } catch (err) {
          console.warn('Save notice:', err);
        }
      });
    }
  });

  function renderGuide(guide, isSaveable) {
    document.title = `${guide.title} - guidea2z`;
    document.getElementById('guide-category-tag').textContent = `#${(guide.category || 'General').toLowerCase().replace(/\s+/g, '_')}`;
    document.getElementById('guide-title').textContent = guide.title;
    const author = guide.author_name || 'Community Member';
    document.getElementById('author-name').textContent = author;
    document.getElementById('author-avatar-initial').textContent = author.charAt(0).toUpperCase();
    document.getElementById('guide-meta').textContent = `${guide.category || 'General'} • Campus Guide`;

    // Hide bookmark button for fallback (non-saveable) guides
    if (!isSaveable) {
      const btn = document.getElementById('bookmark-btn');
      if (btn) btn.classList.add('hidden');
    }

    const contentArea = document.getElementById('guide-content-area');
    if (contentArea) {
      const summaryHtml = guide.summary
        ? `<p class="text-body-lg font-medium text-on-surface mb-4 leading-relaxed border-l-4 border-primary/30 pl-4 italic">${escapeHtml(guide.summary)}</p>`
        : '';
      let stepsHtml = '';
      if (Array.isArray(guide.steps) && guide.steps.length > 0) {
        stepsHtml = guide.steps.map((step, idx) => `
          <div class="bg-surface-container-low rounded-xl p-5 my-4 border border-outline-variant/30 shadow-sm">
            <h4 class="font-headline-md text-primary mb-2 font-bold flex items-center gap-2">
              <span class="w-7 h-7 rounded-full bg-primary text-on-primary text-xs font-bold flex items-center justify-center shrink-0">${idx + 1}</span>
              Step ${idx + 1}
            </h4>
            <p class="font-body-md text-on-surface whitespace-pre-wrap leading-relaxed">${escapeHtml(step)}</p>
          </div>
        `).join('');
      }
      contentArea.innerHTML = summaryHtml + stepsHtml || '<p class="text-on-surface-variant">No content available for this guide yet.</p>';
    }
  }

  function renderNotFound() {
    document.title = 'Guide Not Found - guidea2z';
    const main = document.querySelector('main');
    if (!main) return;
    main.innerHTML = `
      <div class="flex flex-col items-center justify-center min-h-[60vh] text-center px-4 py-16">
        <div class="w-20 h-20 rounded-full bg-surface-container-low text-primary flex items-center justify-center mb-4 shadow-inner">
          <span class="material-symbols-outlined text-4xl">search_off</span>
        </div>
        <h2 class="font-headline-lg text-headline-lg text-on-surface font-bold mb-2">Guide Not Found</h2>
        <p class="font-body-md text-body-md text-on-surface-variant max-w-sm mb-6">This guide may have been removed or the link is incorrect.</p>
        <div class="flex items-center gap-3 flex-wrap justify-center">
          <a href="../browse_new_theme/code.html" class="px-6 py-3 bg-primary text-on-primary font-semibold text-sm rounded-full shadow-md hover:bg-surface-tint transition-all inline-flex items-center gap-2">
            <span class="material-symbols-outlined text-base">explore</span>
            Browse All Guides
          </a>
          <a href="../home_feed_new_theme/code.html" class="px-6 py-3 bg-surface-container-high text-on-surface font-semibold text-sm rounded-full hover:bg-surface-container-highest transition-all inline-flex items-center gap-2">
            <span class="material-symbols-outlined text-base">home</span>
            Go Home
          </a>
        </div>
      </div>
    `;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>"']/g, function(m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
    });
  }
</script>
