<script>
        // Toggle Custom Branch text field when 'Others' department is selected
        const deptRadios = document.querySelectorAll('input[name="department"]');
        const customBranchContainer = document.getElementById('custom-branch-container');
        const customBranchInput = document.getElementById('custom-branch-input');

        deptRadios.forEach(radio => {
            radio.addEventListener('change', () => {
                if (radio.value === 'other') {
                    customBranchContainer.classList.remove('hidden');
                    customBranchInput.focus();
                } else {
                    customBranchContainer.classList.add('hidden');
                }
            });
        });

        document.querySelector('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            
            btn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">refresh</span> Saving...';
            btn.disabled = true;

            try {
                let selectedDept = document.querySelector('input[name="department"]:checked')?.value || 'General';
                if (selectedDept === 'other') {
                    const customVal = customBranchInput?.value?.trim();
                    selectedDept = customVal ? customVal : 'Other';
                }
                
                const selectedYear = document.querySelector('input[name="year"]:checked')?.value || 'Student';

                if (window.Guidea2zSupabase) {
                    const client = window.Guidea2zSupabase.getSupabase();
                    const user = await window.Guidea2zSupabase.auth.getCurrentUser();
                    
                    if (client && user) {
                        // FIX: Write to correct dedicated columns (not role)
                        await client.from('profiles').upsert({
                            id: user.id,
                            email: user.email,
                            department: selectedDept,
                            year: selectedYear,
                            updated_at: new Date().toISOString()
                        });

                        // Also save to localStorage so home page reads instantly
                        const rawName = user.user_metadata?.full_name || user.email?.split('@')[0] || 'Student';
                        const localProf = {
                            name: rawName,
                            email: user.email,
                            department: selectedDept,
                            year: selectedYear
                        };
                        localStorage.setItem('guidea2z_profile', JSON.stringify(localProf));
                    }
                }
                btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check</span> Profile Saved!';
                setTimeout(() => {
                    window.location.href = '../index.html';
                }, 1000);
            } catch (err) {
                console.warn('Profile save note:', err.message);
                window.location.href = '../index.html';
