<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Registration - guidea2z</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../css/theme.css">
<script src="../js/theme.js"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary-fixed": "#ffdad2",
          "surface-bright": "#fff8f6",
          "on-secondary-fixed-variant": "#2c4d3e",
          "primary-fixed-dim": "#ffb4a2",
          "surface-container": "#fceae6",
          "inverse-primary": "#ffb4a2",
          "surface-tint": "#994530",
          "surface-container-low": "#fff1ed",
          "inverse-surface": "#382e2c",
          "on-tertiary-container": "#2c3e4b",
          "outline": "#88726d",
          "on-error-container": "#93000a",
          "on-error": "#ffffff",
          "on-tertiary-fixed": "#0a1d29",
          "on-primary-container": "#6c2412",
          "on-background": "#221a17",
          "on-tertiary": "#ffffff",
          "error": "#ba1a1a",
          "tertiary-container": "#96a9b8",
          "on-tertiary-fixed-variant": "#374956",
          "secondary-fixed": "#c6ebd6",
          "tertiary": "#4e616e",
          "tertiary-fixed-dim": "#b6c9d9",
          "primary": "#994530",
          "on-surface-variant": "#55433e",
          "on-primary-fixed-variant": "#7a2f1b",
          "surface-variant": "#f0dfdb",
          "secondary-fixed-dim": "#aacfbb",
          "surface-container-highest": "#f0dfdb",
          "on-primary": "#ffffff",
          "secondary-container": "#c3e8d4",
          "surface-container-lowest": "#ffffff",
          "on-secondary-container": "#486a59",
          "outline-variant": "#dbc1bb",
          "background": "#fff8f6",
          "surface-container-high": "#f6e4e0",
          "surface": "#fff8f6",
          "on-surface": "#221a17",
          "secondary": "#446555",
          "surface-dim": "#e7d6d2",
          "tertiary-fixed": "#d2e5f5",
          "on-secondary-fixed": "#002115",
          "inverse-on-surface": "#ffede9",
          "on-secondary": "#ffffff",
          "on-primary-fixed": "#3c0700",
          "error-container": "#ffdad6",
          "primary-container": "#f28b71"
        },
        fontFamily: {
          sans: ["Hanken Grotesk", "sans-serif"]
        }
      }
    }
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabaseClient.js"></script>
<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
</style>
</head>
<body class="bg-background min-h-screen text-on-background flex flex-col antialiased overflow-y-auto overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container font-sans">

<!-- Top Navigation -->
<header class="w-full flex items-center justify-between px-6 py-4 max-w-4xl mx-auto">
  <a class="flex items-center gap-2.5 font-bold text-xl text-primary tracking-tight hover:opacity-90 transition-opacity" href="../home_feed_new_theme/code.html">
    <div class="w-8 h-8 rounded-xl bg-primary text-white flex items-center justify-center font-extrabold text-sm shadow">
      g
    </div>
    <span>guidea2z</span>
  </a>

  <!-- Header Actions -->
  <div class="flex items-center gap-2">
    <button type="button" class="theme-toggle-btn w-10 h-10 flex items-center justify-center rounded-full bg-surface-container hover:bg-surface-container-high transition-colors text-on-surface-variant active:scale-95 duration-200" title="Toggle Dark/Light Mode">
      <span class="material-symbols-outlined text-lg theme-toggle-icon">dark_mode</span>
    </button>
    <a class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container hover:bg-surface-container-high transition-colors text-on-surface-variant active:scale-95 duration-200" href="../home_feed_new_theme/code.html" aria-label="Close">
      <span class="material-symbols-outlined text-lg">close</span>
    </a>
  </div>
</header>

<main class="flex-1 flex flex-col items-center justify-center px-4 py-8 w-full max-w-md mx-auto">
  
  <!-- Registration Card -->
  <div class="w-full bg-surface-container-lowest rounded-3xl p-6 sm:p-8 shadow-xl border border-outline-variant/30 relative overflow-hidden">
    
    <div class="text-center mb-6 relative z-10">
      <h1 class="text-2xl sm:text-3xl font-extrabold text-on-background mb-1 tracking-tight">Create your account</h1>
      <p class="text-xs sm:text-sm text-on-surface-variant">Join fellow students to share & discover campus guides.</p>
    </div>

    <form id="signup-form" class="space-y-3.5 relative z-10">
      <!-- Notification message container -->
      <div id="signup-msg" class="hidden p-3 rounded-2xl text-xs font-semibold text-center"></div>

      <!-- Full Name -->
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-outline mb-1" for="fullname">Full Name</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
            <span class="material-symbols-outlined text-outline text-lg">person</span>
          </div>
          <input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-2xl text-sm text-on-background placeholder:text-outline/60 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all shadow-sm" id="fullname" name="fullname" placeholder="e.g. Alex Rivera" required type="text"/>
        </div>
      </div>

      <!-- Email -->
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-outline mb-1" for="email">Campus Email</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
            <span class="material-symbols-outlined text-outline text-lg">mail</span>
          </div>
          <input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-2xl text-sm text-on-background placeholder:text-outline/60 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all shadow-sm" id="email" name="email" placeholder="alex@campus.edu" required type="email"/>
        </div>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-outline mb-1" for="password">Password</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
            <span class="material-symbols-outlined text-outline text-lg">lock</span>
          </div>
          <input class="w-full pl-10 pr-11 py-3 bg-surface-container-lowest border border-outline-variant rounded-2xl text-sm text-on-background placeholder:text-outline/60 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all shadow-sm" id="password" name="password" placeholder="Min. 6 characters" required type="password" minlength="6"/>
          <button id="toggle-signup-password-btn" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-outline hover:text-primary transition-colors focus:outline-none" type="button" aria-label="Toggle password visibility">
            <span id="signup-toggle-icon" class="material-symbols-outlined text-lg">visibility</span>
          </button>
        </div>
      </div>

      <!-- Terms Checkbox -->
      <div class="pt-1">
        <label class="flex items-center space-x-2.5 cursor-pointer group select-none">
          <input id="terms-checkbox" class="w-4 h-4 rounded text-primary focus:ring-primary/30 border-outline-variant" required type="checkbox" checked/>
          <span class="text-xs text-on-surface-variant leading-tight">
            I agree to the <a class="text-primary font-semibold hover:underline" href="#">Terms</a> & <a class="text-primary font-semibold hover:underline" href="#">Privacy Policy</a>.
          </span>
        </label>
      </div>

      <!-- Submit Button -->
      <button id="signup-btn" class="w-full py-3.5 px-4 bg-primary hover:bg-primary-container text-on-primary rounded-2xl font-bold text-sm shadow-md hover:shadow-lg transition-all duration-200 active:scale-95 flex justify-center items-center gap-2 mt-2" type="submit">
        <span>Create Account</span>
        <span class="material-symbols-outlined text-lg">arrow_forward</span>
      </button>

      <!-- Divider -->
      <div class="w-full flex items-center justify-center gap-3 my-3">
        <div class="flex-grow border-t border-outline-variant/50"></div>
        <span class="text-xs uppercase tracking-wider text-outline font-semibold">or sign up with</span>
        <div class="flex-grow border-t border-outline-variant/50"></div>
      </div>

      <!-- Google Signup Button -->
      <button id="google-signup-btn" type="button" class="w-full flex items-center justify-center gap-3 py-3 px-4 border border-outline-variant rounded-2xl bg-surface-container-lowest hover:bg-surface-container-low focus:outline-none focus:ring-2 focus:ring-primary/40 transition-all shadow-sm">
        <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span class="text-sm font-bold text-on-surface">Sign Up with Google</span>
      </button>
    </form>
  </div>

  <!-- Footer Link -->
  <p class="mt-6 text-xs sm:text-sm text-on-surface-variant text-center">
    Already have an account? 
    <a class="font-bold text-primary hover:text-primary-container underline underline-offset-2 ml-1 transition-colors" href="../fun_login_new_theme/code.html">Log In</a>
  </p>
</main>

<script>
  // Password Eye Toggle
  const toggleBtn = document.getElementById('toggle-signup-password-btn');
  const passwordInput = document.getElementById('password');
  const toggleIcon = document.getElementById('signup-toggle-icon');

  if (toggleBtn && passwordInput && toggleIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });
  }

  // Signup Submit Handler
  document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('signup-btn');
    const msg = document.getElementById('signup-msg');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const fullname = document.getElementById('fullname').value.trim();

    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined text-base animate-spin">refresh</span><span>Creating Account...</span>';
    msg.className = 'hidden p-3 rounded-2xl text-xs font-semibold';

    try {
      if (!window.Guidea2zSupabase) {
        throw new Error('Supabase client library not loaded.');
      }
      await window.Guidea2zSupabase.auth.signUp(email, password, fullname);
      
      msg.className = 'block p-3 bg-emerald-100 text-emerald-800 border border-emerald-300 rounded-2xl text-xs font-semibold text-center';
      msg.textContent = 'Account created! Redirecting to setup your academic profile...';
      
      setTimeout(() => {
        window.location.href = '../updated_signup_details/code.html';
      }, 1000);
    } catch (err) {
      msg.className = 'block p-3 bg-rose-100 text-rose-800 border border-rose-300 rounded-2xl text-xs font-semibold text-center';
      msg.textContent = err.message || 'Failed to create account. Please try again.';
      btn.disabled = false;
      btn.innerHTML = '<span>Create Account</span><span class="material-symbols-outlined text-lg">arrow_forward</span>';
    }
  });

  // Google OAuth Signup Handler
  document.getElementById('google-signup-btn').addEventListener('click', async () => {
    const msg = document.getElementById('signup-msg');
    msg.className = 'hidden p-3 rounded-xl text-xs font-medium';

    try {
      if (!window.Guidea2zSupabase) {
        throw new Error('Supabase client library not loaded.');
      }
      msg.className = 'block p-3 bg-blue-100 text-blue-800 border border-blue-300 rounded-2xl text-xs font-semibold text-center';
      msg.textContent = 'Connecting with Google...';
      
      await window.Guidea2zSupabase.auth.signInWithOAuth('google', window.location.origin + '/updated_signup_details/code.html');
    } catch (err) {
      msg.className = 'block p-3 bg-rose-100 text-rose-800 border border-rose-300 rounded-2xl text-xs font-semibold text-center';
      msg.textContent = err.message || 'Failed to initiate Google Sign-Up.';
    }
  });
</script>
</body>
</html>
